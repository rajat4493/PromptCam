# XcodeGen specification for the PromptCam iOS application.
#
# NOT YET GENERATED OR BUILT. This file has never been run through XcodeGen and
# the resulting project has never been compiled, because this repository was
# authored on Linux with no Apple toolchain available. Status: REQUIRES_MAC.
#
# To generate, on a Mac with Xcode 27.1 or later:
#
#   brew install xcodegen
#   xcodegen generate
#   open PromptCam.xcodeproj
#
# See docs/MAC_VALIDATION.md for the full first-run sequence, and
# docs/APPLE_API_CORRECTIONS.md for where to record anything that does not
# compile as written.

name: PromptCam
options:
  bundleIdPrefix: com.example.promptcam
  deploymentTarget:
    # Deployment target is 26.0 rather than 27.x on purpose: the ordinary-iPhone
    # experience must be installable on phones that have not upgraded yet. The
    # Duo code paths are compiled against the newer SDK and gated at runtime.
    #
    # Build with the iOS 27.1 SDK (Xcode 27.1) to get the intended edge-to-edge
    # and vertical-control behaviour described in the supplied Apple guidance.
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

# Four configurations. `Duo` is the development build and `DuoRelease` is the
# archive build for the differentiated product; both enable PROMPTCAM_DUO.
# Ordinary Debug/Release remain available for fallback verification.
configs:
  Debug: debug
  Duo: debug
  DuoRelease: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PromptCamCore:
    path: .

targets:
  PromptCam:
    type: application
    platform: iOS
    # Signing and bundle identifier live in an xcconfig so a developer can
    # change them without editing this spec. Committed with placeholder values
    # so generation always works; see the file's header for keeping local
    # edits out of git.
    configFiles:
      Debug: Support/Signing.xcconfig
      Duo: Support/Signing.xcconfig
      DuoRelease: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: Sources/PromptCamiOS
        excludes:
          - "**/README.md"
    dependencies:
      - package: PromptCamCore
        product: PromptCamCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PromptCam
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        # Portrait and both landscapes. Deliberately NOT restricted to
        # portrait: the director console must work in landscape, which is how
        # most interviews are framed.
        #
        # Per the supplied guidance, an open inner display does not rely on
        # this configuration for layout decisions — size classes, scene
        # geometry, safe areas and reserved regions do that work instead.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Accurate, specific purpose strings. An inaccurate or generic string
        # is both an App Review risk and a trust problem, and a missing one
        # crashes the app the first time capture is requested.
        NSCameraUsageDescription: >-
          PromptCam uses the camera to record the interview you are filming.
          Video is saved on this device and is never uploaded.
        NSMicrophoneUsageDescription: >-
          PromptCam uses the microphone to record what the person you are
          interviewing says. Audio is saved on this device and is never
          uploaded.
        # Recording continues while the screen is active; PromptCam does not
        # request background audio, because capturing after the operator
        # leaves the app would be a privacy surprise.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER and DEVELOPMENT_TEAM come from
        # Support/Signing.xcconfig, so they are not repeated here.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # The iPhone Duo code paths live in the `Duo` configuration below and
        # the "PromptCam (Duo)" scheme, not here, so the baseline build and the
        # test run cannot be blocked by an unconfirmed Duo API signature.
        # See Sources/PromptCamiOS/Platform/README.md.
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Duo:
          # Enables Sources/PromptCamiOS/Platform. Expect to reconcile the
          # supplied Duo API signatures here first — see
          # docs/APPLE_API_CORRECTIONS.md and docs/MAC_VALIDATION.md step 8.
          # Add PROMPTCAM_USE_ARRANGEMENT_VIEW to also trial ArrangementView.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PROMPTCAM_DUO
        DuoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PROMPTCAM_DUO
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  PromptCamiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PromptCamiOSTests
    dependencies:
      - target: PromptCam
      - package: PromptCamCore
        product: PromptCamCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Baseline: ordinary iPhone behaviour, no Duo symbols referenced at all.
  PromptCam:
    build:
      targets:
        PromptCam: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PromptCamiOSTests

  # iPhone Duo: the differentiated experience. Select this scheme to build the
  # subject-facing accessory, reserved-region layout and hinge observation.
  PromptCam (Duo):
    build:
      targets:
        PromptCam: all
    run:
      config: Duo
    test:
      config: Duo
      targets:
        - PromptCamiOSTests
    archive:
      config: DuoRelease
